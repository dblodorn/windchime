  cursor: String!
  node: LoraTraining!
}

"""Which side of the hidden flag to return."""
enum Visibility {
  ANY
  HIDDEN
  VISIBLE
}

"""
A VZ-1 / VZ-10M voice saved anonymously. Hidden ones are visible to admins only.
"""
type VzVoice implements Node & SynthPatch {
  """ISO-8601. The listing is ordered by this."""
  createdAt: String!

  """The 336 decoded voice bytes as base64 (448 characters)."""
  data: String!

  """Admin only."""
  hidden: Boolean
  id: ID!

  """
  The voice's name as the VZ shows it, read from the bytes; may be empty.
  """
  name: String!

  """ISO-8601. Equals createdAt until the voice is updated."""
  updatedAt: String!

  """
  Whether this device key saved the voice. The key is never stored, only compared by hash.
  """
  yours(creatorKey: String!): Boolean!
}

