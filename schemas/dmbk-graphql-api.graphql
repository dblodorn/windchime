}

"""
A windchime composition saved anonymously: 1–16 chimes. Hidden ones are visible to admins only.
"""
type ChimeComposition implements Node {
  """ISO-8601."""
  createdAt: String!

  """Admin only."""
  hidden: Boolean
  id: ID!

  """Generated by the API from the units: ensemble, key and instrument."""
  title: String!
  unitCount: Int!

  """In page order."""
  units: [ChimeUnit!]!
}

"""
The instrument a unit is: the tube chime, or the furin bell (one note, its root).
"""
enum ChimeInstrument {
  CHIME
  FURIN
}

enum ChimeMidiMode {
  MONO
  POLY
}

"""One chime of a saved composition."""
type ChimeUnit {
  """MIDI channel, 1–16."""
  channel: Int!

  """The FREQUENCY slider × 1000, 0–1000."""
  cutoff: Int!

  """DECAY in tenths of a second, 3–120."""
  decay: Int!

  """CHIME for units saved before instruments existed."""
  instrument: ChimeInstrument!
  midiMode: ChimeMidiMode!

  """Whether the tube-notes drawer is shown."""
  notes: Boolean!

  """
  External-synth units only: the patch's id in that synth's library (24
  lowercase hex, the `_id` of e.g. a VzVoice), null for the synth's INIT patch.
  Null on every other unit.
  """
  patch: String

  """Stacking order among the units, 0 at the back, 0–15."""
  rank: Int!

  """RESONANCE × 10, 5–180."""
  resonance: Int!

  """Root MIDI note, 0–119."""
  root: Int!

  """A scale name from windchime's catalog."""
  scale: String!

  """Tube count, 2–8."""
  tubes: Int!

  """
  A voice id from windchime's catalog (`v<i>` built-in, `s0:<p>` GM preset,
  `x:<synth>` external synth); null for the default.
  """
  voice: String

  """VOLUME in percent, 0–100."""
  volume: Int!

  """WIND in percent, 0–100."""
  wind: Int!

  """Horizontal offset from the page center, in CSS px, -32768–32767."""
  x: Int!

  """Vertical offset from the page center, in CSS px, -32768–32767."""
  y: Int!
}

"""
One chime to save. Every field is required except `voice`, `instrument` and `patch`.
"""
input ChimeUnitInput {
  """MIDI channel, 1–16."""
  channel: Int!

  """The FREQUENCY slider × 1000, 0–1000."""
  cutoff: Int!

  """DECAY in tenths of a second, 3–120."""
  decay: Int!

  """Omitted means CHIME."""
  instrument: ChimeInstrument
  midiMode: ChimeMidiMode!
  notes: Boolean!

  """
  External-synth units only: the patch's id in that synth's library (24
  lowercase hex, the `_id` of e.g. a VzVoice), null for the synth's INIT patch.
  Omitted means null. Refused on any other unit.
  """
  patch: String

  """Stacking order among the units, 0 at the back, 0–15."""
  rank: Int!

  """RESONANCE × 10, 5–180."""
  resonance: Int!

  """Root MIDI note, 0–119."""
  root: Int!

  """A scale name from windchime's catalog."""
  scale: String!

  """Tube count, 2–8."""
  tubes: Int!

  """
  A voice id from windchime's catalog (`v<i>` built-in, `s0:<p>` GM preset,
  `x:<synth>` external synth); null for the default. Omitted means null.
  """
  voice: String

  """VOLUME in percent, 0–100."""
  volume: Int!

  """WIND in percent, 0–100."""
  wind: Int!

  """Horizontal offset from the page center, in CSS px, -32768–32767."""
  x: Int!

  """Vertical offset from the page center, in CSS px, -32768–32767."""
  y: Int!
}

