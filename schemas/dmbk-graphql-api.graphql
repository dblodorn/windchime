type Mutation {
  """Forget this account's Are.na user. True even when none was saved."""
  arenaClearUser: Boolean!

  """
  Save this account's Are.na user. Fails with NOT_FOUND when Are.na doesn't know the slug.
  """
  arenaSetUser(input: ArenaSetUserInput!): ArenaSetUserPayload!
  dmbkPhotosDeletePhoto(input: DmbkPhotosDeletePhotoInput!): DmbkPhotosDeletePhotoPayload!
  dmbkPhotosFinalizePhoto(input: DmbkPhotosFinalizePhotoInput!): DmbkPhotosFinalizePhotoPayload!
  dmbkPhotosReservePhotoUpload(input: DmbkPhotosReservePhotoUploadInput!): DmbkPhotosReservePhotoUploadPayload!
  dmbkPhotosSetPhotoHidden(input: DmbkPhotosSetPhotoHiddenInput!): DmbkPhotosSetPhotoHiddenPayload!
  dmbkPhotosUpdatePhoto(input: DmbkPhotosUpdatePhotoInput!): DmbkPhotosUpdatePhotoPayload!

  """
  Delete a bank for good (its voices stay). Only the device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundDeleteDx7Bank(input: DmbkSoundDeleteDx7BankInput!): DmbkSoundDeleteDx7BankPayload!

  """
  Delete a voice for good. Only the device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundDeleteDx7Voice(input: DmbkSoundDeleteDx7VoiceInput!): DmbkSoundDeleteDx7VoicePayload!

  """
  Delete a patch for good. Only the device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundDeleteJuno60Voice(input: DmbkSoundDeleteJuno60VoiceInput!): DmbkSoundDeleteJuno60VoicePayload!

  """
  Delete a voice for good. Only the device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundDeleteVzVoice(input: DmbkSoundDeleteVzVoiceInput!): DmbkSoundDeleteVzVoicePayload!

  """
  Save a composition anonymously, with a title the API generates. Identical
  units return the stored composition with `created: false`. Rate-limited per
  visitor (`X-End-User-IP`) and per client.
  """
  dmbkSoundSaveChimeComposition(input: DmbkSoundSaveChimeCompositionInput!): DmbkSoundSaveChimeCompositionPayload!

  """
  Save a bank anonymously under a device key. The same key saving an identical
  bank again returns it with `created: false`. Every voice must be a saved,
  visible DX7 voice (anyone's). Shares the DX7 write budget.
  """
  dmbkSoundSaveDx7Bank(input: DmbkSoundSaveDx7BankInput!): DmbkSoundSaveDx7BankPayload!

  """
  Save a voice anonymously under a device key. The same key saving identical
  bytes again returns the stored voice with `created: false`. Obscene names are
  refused (BAD_USER_INPUT). Rate-limited per visitor (`X-End-User-IP`) and per client.
  """
  dmbkSoundSaveDx7Voice(input: DmbkSoundSaveDx7VoiceInput!): DmbkSoundSaveDx7VoicePayload!

  """
  Save a patch anonymously under a device key. The same key saving identical
  bytes again returns the stored patch with `created: false`. Obscene names are
  refused (BAD_USER_INPUT). Rate-limited per visitor (`X-End-User-IP`) and per client.
  """
  dmbkSoundSaveJuno60Voice(input: DmbkSoundSaveJuno60VoiceInput!): DmbkSoundSaveJuno60VoicePayload!

  """
  Save a voice anonymously under a device key. The same key saving identical
  bytes again returns the stored voice with `created: false`. Obscene names are
  refused (BAD_USER_INPUT). Rate-limited per visitor (`X-End-User-IP`) and per client.
  """
  dmbkSoundSaveVzVoice(input: DmbkSoundSaveVzVoiceInput!): DmbkSoundSaveVzVoicePayload!
  dmbkSoundSetChimeCompositionHidden(input: DmbkSoundSetChimeCompositionHiddenInput!): DmbkSoundSetChimeCompositionHiddenPayload!
  dmbkSoundSetDx7BankHidden(input: DmbkSoundSetDx7BankHiddenInput!): DmbkSoundSetDx7BankHiddenPayload!
  dmbkSoundSetDx7VoiceHidden(input: DmbkSoundSetDx7VoiceHiddenInput!): DmbkSoundSetDx7VoiceHiddenPayload!
  dmbkSoundSetJuno60VoiceHidden(input: DmbkSoundSetJuno60VoiceHiddenInput!): DmbkSoundSetJuno60VoiceHiddenPayload!
  dmbkSoundSetVzVoiceHidden(input: DmbkSoundSetVzVoiceHiddenInput!): DmbkSoundSetVzVoiceHiddenPayload!

  """
  Replace a bank's name and slots. Only the device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundUpdateDx7Bank(input: DmbkSoundUpdateDx7BankInput!): DmbkSoundUpdateDx7BankPayload!

  """
  Replace a voice's bytes (renaming it too, since the name is in them). Only the
  device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundUpdateDx7Voice(input: DmbkSoundUpdateDx7VoiceInput!): DmbkSoundUpdateDx7VoicePayload!

  """
  Replace a patch's bytes (renaming it too, since the name is in them). Only the
  device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundUpdateJuno60Voice(input: DmbkSoundUpdateJuno60VoiceInput!): DmbkSoundUpdateJuno60VoicePayload!

  """
  Replace a voice's bytes (renaming it too, since the name is in them). Only the
  device key that saved it may; others get FORBIDDEN.
  """
  dmbkSoundUpdateVzVoice(input: DmbkSoundUpdateVzVoiceInput!): DmbkSoundUpdateVzVoicePayload!

  """Mark a training completed. Already completed: changes nothing."""
  loraTrainerCompleteTraining(input: LoraTrainerCompleteTrainingInput!): LoraTrainerCompleteTrainingPayload!
  loraTrainerCreateTraining(input: LoraTrainerCreateTrainingInput!): LoraTrainerCreateTrainingPayload!

  """Record images generated with one completed LoRA, all or nothing."""
  loraTrainerRecordImages(input: LoraTrainerRecordImagesInput!): LoraTrainerRecordImagesPayload!
  loraTrainerSetImageHidden(input: LoraTrainerSetImageHiddenInput!): LoraTrainerSetImageHiddenPayload!
  loraTrainerSetTrainingAssets(input: LoraTrainerSetTrainingAssetsInput!): LoraTrainerSetTrainingAssetsPayload!
  loraTrainerSetTrainingHidden(input: LoraTrainerSetTrainingHiddenInput!): LoraTrainerSetTrainingHiddenPayload!
  signInWithGoogle(input: SignInWithGoogleInput!): SignInWithGooglePayload!

  """
  Revoke this request's session. False when there was no valid session to revoke.
  """
  signOut: Boolean!
}

interface Node {
  id: ID!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""
A photo from the dmbk library. Non-admins only ever see ready, visible photos.
"""
type Photo implements Node {
  """ISO-8601."""
  createdAt: String!
  displayUrl: String

  """Admin only. Why finalization rejected this upload, when it did."""
  failureReason: String

  """
  Null when this photo predates the grid variant — absent, not a dead URL.
  """
  gridUrl: String
  height: Int

  """Admin only; null otherwise."""
  hidden: Boolean
  id: ID!

  """Normalized slugs."""
  keywords: [String!]!

  """Admin only; null otherwise."""
  status: PhotoStatus
  thumbUrl: String
  title: String

  """ISO-8601."""
  updatedAt: String!

  """Intrinsic pixel width, for reserving layout space."""
  width: Int
}

"""Where a photo is in its lifecycle."""
enum PhotoStatus {
  FAILED
  PENDING
  READY
}

type Query {
  _health: String!

  """
  A public or closed Are.na channel by slug, or null when it is private or does not exist.
  """
  arenaChannel(slug: String!): ArenaChannel

  """Photos, newest first."""
  dmbkPhotos(
    after: String
    before: String
    first: Int

    """Every keyword must be present. Normalized like stored keywords."""
    keywords: [String!]
    last: Int

    """Admin only unless [READY] (the default)."""
    states: [PhotoStatus!]

    """Admin only unless VISIBLE (the default)."""
    visibility: Visibility
  ): QueryDmbkPhotosConnection!

  """The photo keyword vocabulary, most used first."""
  dmbkPhotosKeywords: [Keyword!]!

  """Saved windchime compositions that are not hidden, newest first."""
  dmbkSoundChimeCompositions(after: String, before: String, first: Int, last: Int): QueryDmbkSoundChimeCompositionsConnection!

  """
  Saved DX7 banks that are not hidden, newest first (the factory ROM cards among
  them). `creatorKey` narrows them to that device key's banks; `search` to names
  containing the text.
  """
  dmbkSoundDx7Banks(
    after: String
    before: String

    """A device key: only the banks it saved."""
    creatorKey: String
    first: Int
    last: Int

    """Names containing this text, ignoring case; at most 20 characters."""
    search: String
  ): QueryDmbkSoundDx7BanksConnection!

  """
  Saved DX7 voices that are not hidden, newest first. `creatorKey` narrows them
  to that device key's voices; `search` to names containing the text.
  """
  dmbkSoundDx7Voices(
    after: String
    before: String

    """A device key: only the voices it saved."""
    creatorKey: String
    first: Int
    last: Int

    """Names containing this text, ignoring case; at most 10 characters."""
    search: String
  ): QueryDmbkSoundDx7VoicesConnection!

  """
  Saved Juno-60 patches that are not hidden, newest first (Roland's factory
  patches among them). `creatorKey` narrows them to that device key's patches;
  `search` to names containing the text.
  """
  dmbkSoundJuno60Voices(
    after: String
    before: String

    """A device key: only the patches it saved."""
    creatorKey: String
    first: Int
    last: Int

    """Names containing this text, ignoring case; at most 16 characters."""
    search: String
  ): QueryDmbkSoundJuno60VoicesConnection!

  """The latest cached SoundCloud playlists snapshot."""
  dmbkSoundPlaylists: SoundSnapshot

  """
  Saved VZ voices that are not hidden, newest first. `creatorKey` narrows them
  to that device key's voices; `search` to names containing the text.
  """
  dmbkSoundVzVoices(
    after: String
    before: String

    """A device key: only the voices it saved."""
    creatorKey: String
    first: Int
    last: Int

    """Names containing this text, ignoring case; at most 12 characters."""
    search: String
  ): QueryDmbkSoundVzVoicesConnection!

  """
  Up to `count` (1–20) distinct images in random order, from visible generated images and visible, completed trainings.
  """
  loraTrainerSlideshowImages(count: Int! = 10): [LoraTrainerSlideshowImage!]!

  """Completed, visible LoRA trainings, newest first."""
  loraTrainerTrainings(after: String, before: String, first: Int, last: Int): QueryLoraTrainerTrainingsConnection!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!

  """The signed-in wallet, or null when anonymous."""
  viewer: Viewer
}

