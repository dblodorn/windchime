"""
A bank of 32 DX7 voice slots, like a cartridge, saved anonymously. Hidden ones are visible to admins only.
"""
type Dx7Bank implements Node {
  """ISO-8601. The listing is ordered by this."""
  createdAt: String!

  """Admin only."""
  hidden: Boolean
  id: ID!
  name: String!

  """
  Exactly 32, in cartridge order. A slot is null when empty, or when its voice has been deleted or hidden.
  """
  slots: [Dx7Voice]!
  updatedAt: String!

  """Whether this device key saved the bank."""
  yours(creatorKey: String!): Boolean!
}

"""
A Yamaha DX7 voice saved anonymously. Hidden ones are visible to admins only.
"""
type Dx7Voice implements Node & SynthPatch {
  """ISO-8601. The listing is ordered by this."""
  createdAt: String!

  """
  The 155 unpacked voice bytes (VCED, OP6 first) as base64 (208 characters).
  """
  data: String!

  """Admin only."""
  hidden: Boolean
  id: ID!

  """
  The voice's name as the DX7 shows it, read from the bytes; may be empty.
  """
  name: String!

  """ISO-8601. Equals createdAt until the voice is updated."""
  updatedAt: String!

  """
  Whether this device key saved the voice. The key is never stored, only compared by hash.
  """
  yours(creatorKey: String!): Boolean!
}

